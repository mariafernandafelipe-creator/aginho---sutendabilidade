<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrinho 2026 - EcoSolo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">EcoSolo<span>.</span></div>
            <p>Consciência e Lucratividade</p>
        </header>

        <main>
            <section class="card-form">
                <h3>Análise do seu Solo</h3>
                
                <div class="input-group">
                    <label for="tipoSolo">Tipo de Solo:</label>
                    <select id="tipoSolo">
                        <option value="argiloso">Argiloso (Terra Roxa)</option>
                        <option value="arenoso">Arenoso</option>
                        <option value="misto">Misto / Franco</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="umidade">Umidade Atual (%):</label>
                    <input type="number" id="umidade" placeholder="Ex: 25" min="0" max="100">
                </div>

                <div class="input-group">
                    <label for="materiaPrima">Uso de Fertilizante (kg/ha):</label>
                    <input type="number" id="materiaPrima" placeholder="Ex: 150">
                </div>
            </section>

            <section class="card-feedback">
                <button class="btn-action" onclick="calcularFeedback()">Gerar Retroalimentação</button>
                
                <div id="resultado" class="resultado-box">
                    Insira os dados acima para receber as instruções de economia.
                </div>
            </section>
        </main>

        <footer>
            <p>Agrinho 2026 - Tecnologia a Serviço da Terra</p>
        </footer>
    </div>

    <script>
        // Esta função agora pega o que o usuário digitou e mostra um resultado personalizado
        function calcularFeedback() {
            // Pegando os valores que o usuário digitou na tela
            const solo = document.getElementById('tipoSolo').value;
            const umidade = document.getElementById('umidade').value;
            const fertilizante = document.getElementById('materiaPrima').value;
            const resultado = document.getElementById('resultado');

            // Validação simples: se o usuário esquecer de digitar algo
            if (umidade === "" || fertilizante === "") {
                resultado.innerHTML = "<strong style='color: #FF5555;'>Aviso:</strong> Por favor, preencha todos os campos para a análise.";
                return;
            }

            // Lógica inteligente simulada (Retroalimentação)
            let economia = fertilizante * 0.15; // Simula 15% de economia de matéria-prima
            let recomendacao = "";

            if (umidade < 30) {
                recomendacao = `O solo ${solo} está muito seco (${umidade}%). Ative a irrigação controlada para não desperdiçar o fertilizante aplicado.`;
            } else {
                recomendacao = `A umidade está ideal (${umidade}%). Reduza a próxima carga de fertilizante para ${fertilizante - economia} kg/ha.`;
            }

            // Mostra a resposta na tela para o grande ou pequeno produtor
            resultado.innerHTML = `
                <strong>Análise Concluída:</strong><br><br>
                ${recomendacao}<br><br>
                <span style="color: #00EBFF;">🌱 Economia gerada: R$ ${(economia * 4.5).toFixed(2)} por hectare.</span>
            `;
            resultado.style.background = "rgba(0, 255, 200, 0.08)";
        }
    </script>
</body>
</html>
